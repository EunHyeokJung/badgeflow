<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="LanyardStudio has moved to lanyard-studio.com."
    />
    <link rel="canonical" href="https://lanyard-studio.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/moved.js" defer></script>
    <title>LanyardStudio has moved</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="skipLink">
      Skip to the notice
    </a>

    <header class="site-header">
      <a
        class="brand"
        href="https://lanyard-studio.com/"
        aria-label="LanyardStudio"
      >
        <span class="brand-mark" aria-hidden="true">L</span>
        <strong>LanyardStudio</strong>
      </a>

      <label class="language-control" for="language-select">
        <span data-i18n="languageLabel">Language</span>
        <select id="language-select">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </label>
    </header>

    <main id="main-content" tabindex="-1">
      <section class="notice-card" aria-labelledby="notice-title">
        <div class="move-symbol" aria-hidden="true">
          <span>lanyardstudio.silverhyeok.dev</span>
          <i></i>
          <strong>lanyard-studio.com</strong>
        </div>

        <h1 id="notice-title" data-i18n="title">
          LanyardStudio has moved
        </h1>
        <p class="description" data-i18n="description">
          The official website is now available at a new address.
        </p>

        <div class="new-address">
          <span data-i18n="addressLabel">New address</span>
          <a href="https://lanyard-studio.com/">lanyard-studio.com</a>
        </div>

        <a class="primary-link" href="https://lanyard-studio.com/">
          <span data-i18n="openSite">Open the new website</span>
          <span aria-hidden="true">→</span>
        </a>

        <p class="bookmark-note" data-i18n="bookmarkNote">
          Please update your bookmark to the new address.
        </p>
      </section>
    </main>

    <footer>© 2026 LanyardStudio</footer>

    <noscript>
      <p class="noscript-notice">
        LanyardStudio has moved to
        <a href="https://lanyard-studio.com/">lanyard-studio.com</a>.
      </p>
    </noscript>
  </body>
</html>
