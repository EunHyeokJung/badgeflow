name: 기능 제안
description: 새로운 편집·데이터·출력 기능을 제안해 주세요.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: need
    attributes:
      label: 해결하려는 문제
      description: 누가 어떤 상황에서 불편한지 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 기대하는 동작과 사용자 흐름을 설명해 주세요.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 디자인 편집기
        - CSV 및 데이터
        - PDF 및 인쇄
        - 프로젝트 저장
        - 접근성
        - 기타
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
