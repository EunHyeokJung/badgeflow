name: 버그 신고
description: 재현 가능한 LanyardStudio 문제를 알려 주세요.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: 보안 취약점은 공개 이슈 대신 SECURITY.md의 비공개 절차를 이용해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 실제로 일어난 일과 예상한 동작을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 브라우저와 운영체제
      placeholder: Chrome 130 / macOS 15
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 관련 파일 또는 화면
      description: 개인정보를 제거한 최소 재현 파일이나 스크린샷을 첨부해 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 기존 이슈에서 같은 문제를 찾지 못했습니다.
          required: true
        - label: 첨부 파일에서 개인정보를 제거했습니다.
          required: true
